services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: factory_attendance
      POSTGRES_USER: factory_demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - attendance_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory_demo -d factory_attendance"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  attendance_data:
